name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'   # daily drift check against api-dev

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      # Same command a person runs locally; same output. If it is green here it is green there.
      - run: npm run check
      # The generator ran inside `check`. If it changed anything, the commit was missing generated output.
      - run: git diff --exit-code -- src/generated docs || (echo "::error::generated output is stale. Run npm run check locally and commit src/generated and docs." && exit 1)
      # The package version bump must be at least what the declaration diff requires.
      - name: semver check
        if: github.event_name == 'pull_request'
        run: |
          git show ${{ github.event.pull_request.base.sha }}:src/generated/api.json > /tmp/base-api.json
          git show ${{ github.event.pull_request.base.sha }}:package.json > /tmp/base-package.json
          npx tsx scripts/semver.ts /tmp/base-api.json --enforce /tmp/base-package.json

  # Proves the declaration against api-dev. Read-only, public actions only.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run test:contract

  publish:
    needs: [verify, contract]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, registry-url: https://npm.pkg.github.com, scope: "@ubc-biztech" }
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: publish if new version
        env: { NODE_AUTH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@ubc-biztech/sdk@$V" version >/dev/null 2>&1; then echo "already published $V"; else npm publish; fi
